<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="a1wvHG9ci2qKT_dKIuZzOKEmzgaR_neYst6g7ADBjTw" />
    <meta name="naver-site-verification" content="e85fdb8c82d1ce3dcea884d41c9d61de4872c5a1" />

    <!-- Open Graph -->
    <meta property="og:title" content="{{ page.title | default: site.title }}" />
    <meta property="og:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
    <meta property="og:url" content="{{ page.url | absolute_url }}" />
    <meta property="og:site_name" content="{{ site.title }}" />
    <meta property="og:type" content="{% if page.date %}article{% else %}website{% endif %}" />
    <meta property="og:image" content="{{ '/assets/images/og-image.png' | absolute_url }}" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ page.title | default: site.title }}" />
    <meta name="twitter:description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}" />
    <meta name="twitter:image" content="{{ '/assets/images/og-image.png' | absolute_url }}" />

    {% seo %}

    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700&display=swap');
      body { font-family: 'Noto Sans KR', sans-serif; max-width: 860px; margin: 0 auto; padding: 20px; line-height: 1.8; color: #333; background: #fff; }
      header { border-bottom: 2px solid #222; padding-bottom: 15px; margin-bottom: 30px; }
      header h1 a { text-decoration: none; color: #222; font-size: 1.8em; }
      header p { color: #666; margin: 5px 0; font-size: 0.95em; }
      nav { margin-top: 10px; }
      nav a { margin-right: 15px; color: #0066cc; text-decoration: none; font-size: 0.9em; }
      h1, h2, h3 { color: #222; }
      h2 { border-bottom: 1px solid #eee; padding-bottom: 5px; margin-top: 40px; }
      table { border-collapse: collapse; width: 100%; margin: 20px 0; font-size: 0.9em; }
      th, td { border: 1px solid #ddd; padding: 10px 12px; text-align: left; }
      th { background-color: #f5f5f5; font-weight: bold; }
      tr:nth-child(even) { background-color: #fafafa; }
      a { color: #0066cc; }
      code { background: #f4f4f4; padding: 2px 6px; border-radius: 3px; font-size: 0.9em; }
      pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
      blockquote { border-left: 4px solid #0066cc; margin: 0; padding: 10px 20px; background: #f8f9ff; color: #555; }
      .post-list { list-style: none; padding: 0; }
      .post-list li { padding: 12px 0; border-bottom: 1px solid #eee; }
      .post-list li a { text-decoration: none; color: #222; font-weight: bold; }
      .post-list li a:hover { color: #0066cc; }
      .post-date { color: #999; font-size: 0.85em; margin-left: 10px; }
      footer { border-top: 1px solid #ddd; margin-top: 60px; padding-top: 20px; color: #999; font-size: 0.85em; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
      <nav>
        <a href="{{ '/' | relative_url }}">홈</a>
        <a href="{{ '/categories/' | relative_url }}">카테고리</a>
      </nav>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>© {{ site.title }} {{ 'now' | date: "%Y" }}</p>
      <p>⚠️ 본 블로그의 주식 분석은 투자 참고용이며 투자 권유가 아닙니다.</p>
    </footer>
  </body>
</html>
