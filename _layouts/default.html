<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="google-site-verification" content="a1wvHG9ci2qKT_dKIuZzOKEmzgaR_neYst6g7ADBjTw" />
    <meta name="naver-site-verification" content="e85fdb8c82d1ce3dcea884d41c9d61de4872c5a1" />
    {% seo %}
    <title>{{ page.title }} | {{ site.title }}</title>
    <style>
      body { font-family: 'Noto Sans KR', sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.8; color: #333; }
      header { border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 30px; }
      header h1 a { text-decoration: none; color: #333; }
      header p { color: #666; margin: 5px 0; }
      table { border-collapse: collapse; width: 100%; margin: 20px 0; }
      th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
      th { background-color: #f5f5f5; }
      a { color: #0066cc; }
      footer { border-top: 1px solid #ddd; margin-top: 50px; padding-top: 20px; color: #666; font-size: 0.9em; }
      .post-list { list-style: none; padding: 0; }
      .post-list li { padding: 10px 0; border-bottom: 1px solid #eee; }
    </style>
  </head>
  <body>
    <header>
      <h1><a href="{{ '/' | relative_url }}">{{ site.title }}</a></h1>
      <p>{{ site.description }}</p>
    </header>
    <main>
      {{ content }}
    </main>
    <footer>
      <p>© {{ site.title }} {{ 'now' | date: "%Y" }} | 본 블로그의 주식 분석은 투자 참고용이며 투자 권유가 아닙니다.</p>
    </footer>
  </body>
</html>
